name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, lint and tests
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Build
        run: |
          npm run build
          test -s main.js
          test -s manifest.json
          test -s styles.css
          # the bundle is tracked so plugins can be installed from a branch
          git diff --exit-code -- main.js
